[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    theory: Tests based on canonical algorithm theory (synthetic data)
    notebook_parity: Tests comparing with notebook CSV outputs (requires dataset)
    slow: Slow-running tests (e.g., full pipeline)

# Ignore warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
